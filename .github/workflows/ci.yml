name: rust_music operator-owned offline gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-only:
    # No marketplace actions, online toolchain installer, artifact downloader, or
    # apt dependency. Provision a locked-down offline runner manually, including
    # a pre-checked-out copy of the exact commit and Rust std toolchain.
    runs-on: [self-hosted, rust-music-offline]
    steps:
      - name: Confirm checked-out local commit and execute offline gate
        shell: bash
        run: |
          set -euo pipefail
          : "${RUST_MUSIC_SOURCE_ROOT:?Operator must set local checked-out source path}"
          cd "$RUST_MUSIC_SOURCE_ROOT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh scripts/offline-gate.sh
